name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "Backend (pytest: engine suite + root E2E suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: desktop/backend/uv.lock

      - name: Install Python 3.12 (uv-managed)
        run: uv python install 3.12

      - name: Backend engine suite (desktop/backend)
        working-directory: desktop/backend
        run: |
          uv sync
          mkdir -p runtime/verification/ci
          uv run pytest -q --junitxml=runtime/verification/ci/backend.xml

      - name: Root E2E suite (tests/)
        run: uv run --project desktop/backend pytest tests/ -q --junitxml=desktop/backend/runtime/verification/ci/root.xml

      - name: Upload backend regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-lab-backend-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/backend/runtime/verification/ci/
          if-no-files-found: error

  ui:
    name: UI (npm test + build, dist drift gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: desktop/backend/uv.lock

      - name: Install Python 3.12 for the isolated repair harness
        run: uv python install 3.12

      - name: Install locked backend runtime for browser acceptance
        run: uv sync --project desktop/backend --locked

      - name: Install, test, build
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
          node build.mjs

      - name: Install Chromium for browser acceptance
        working-directory: desktop/ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: test/.tmp/ms-playwright
        run: npx playwright install --with-deps chromium

      - name: Run real React repair browser acceptance
        working-directory: desktop/ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: test/.tmp/ms-playwright
        run: npm run test:repair-e2e

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-lab-browser-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/ui/test/.tmp/repair-browser/
          if-no-files-found: error

      - name: Assert committed dist/ matches a fresh build
        run: git diff --exit-code -- desktop/ui/dist

      - name: Explain dist drift
        if: failure()
        run: |
          echo "::error::desktop/ui/dist does not match a fresh build."
          echo "::error::dist/ is committed on purpose: the backend serves it directly"
          echo "::error::(api/app.py -> _UI_DIST), so it is a runtime artefact, not a build leftover."
          echo "::error::Fix: cd desktop/ui && node build.mjs, then commit the updated dist/ files."

  android:
    name: Android (gradle test + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper + dependency cache (keeps Android job well under timeout).
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:test :app:assembleDebug --console=plain --parallel

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dive-into-crypto-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
