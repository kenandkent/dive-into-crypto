# Release pipeline for short-lab (desktop) and dive-into-crypto (Android).
#
# Tag contract (design section 40):
#   `v*`           — Android ONLY. Builds the signed Android release APK + AAB
#                    and publishes a GitHub Release with both attached.
#   `short-lab-v*` — Desktop ONLY. Packages the desktop backend with
#                    PyInstaller (short-lab.spec -> dist/short-lab/), zips it
#                    as short-lab-windows-x64.zip and attaches it to the
#                    GitHub Release for that tag.
#   workflow_dispatch with the `package_desktop` input ticked — Desktop
#                    packaging to a workflow artifact ONLY (no GitHub Release).
#
# Signing degrades gracefully: when the KEYSTORE_BASE64 secret is absent, the
# release build is still produced and uploaded, just UNSIGNED (the signing
# scaffold in android/app/build.gradle.kts skips the signing config whenever any
# of STORE_FILE / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is blank). See
# docs/packaging.md for the secret names and the keystore how-to.

name: Release

on:
  push:
    tags: ["v*", "short-lab-v*"]
  workflow_dispatch:
    inputs:
      package_desktop:
        description: "Run the desktop packaging job (PyInstaller onedir bundle)"
        type: boolean
        default: false

# Never cancel an in-flight release build for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Android release (signed APK + AAB)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # Step-level `if:` cannot evaluate secrets in every position we need, so
      # the guard is an env-mirror check inside the step — the documented
      # equivalent of `if: secrets.KEYSTORE_BASE64 != ''`.
      - name: Decode keystore (prep step)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no keystore secret set; APK will be unsigned"
          else
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore.jks
            echo "keystore decoded: $(wc -c < android/app/release.keystore.jks) bytes"
          fi

      # Secret -> gradle env mapping (defaults documented in docs/packaging.md):
      #   STORE_FILE       — default `app/release.keystore.jks`: the path the
      #                      prep step writes to, relative to the android/ root
      #                      (gradle resolves it via rootProject.file()).
      #   STORE_PASSWORD   — from secret KEYSTORE_PASSWORD
      #   KEY_ALIAS        — from secret KEY_ALIAS
      #   KEY_PASSWORD     — from secret KEY_PASSWORD
      # Blank values are safe: android/app/build.gradle.kts treats any blank
      # entry as "no signing config" and produces an unsigned release build.
      - name: Build release APK + AAB
        working-directory: android
        env:
          STORE_FILE: app/release.keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain --parallel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f android/app/release.keystore.jks ]; then
            SIGN_LINE="Signed with the release keystore (KEYSTORE_BASE64 secret)."
          else
            SIGN_LINE="**Unsigned build** — the KEYSTORE_BASE64 secret was not set, so Android will ask for confirmation before installing. See docs/packaging.md."
          fi
          {
            echo "# Dive Into Crypto ${GITHUB_REF_NAME}"
            echo
            echo "${SIGN_LINE}"
            echo
            echo "- the attached \`.apk\` is the installable release build (R8-minified)"
            echo "- the attached \`.aab\` is the Play-store bundle"
            echo
            echo "The desktop edition (short-lab) ships on separate \`short-lab-v*\` tags — see docs/packaging.md."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dive Into Crypto ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Upload release assets (APK + AAB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --clobber \
            android/app/build/outputs/apk/release/*.apk \
            android/app/build/outputs/bundle/release/*.aab

  package-desktop:
    name: Desktop package (PyInstaller onedir)
    # Desktop ONLY: short-lab-v* tags publish to a GitHub Release; manual
    # dispatch (package_desktop ticked) uploads a workflow artifact instead.
    # Never on `v*` (Android) tags.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/short-lab-v')) || (github.event_name == 'workflow_dispatch' && inputs.package_desktop == true)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload the desktop zip (tag builds)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: desktop/backend/uv.lock

      # R16 reproducible UI toolchain (design D17): Node 22.x only
      # (engines >=22 <23, lock root in sync). The committed dist/ is a
      # runtime artefact served by the backend, so the release build
      # reinstalls from the lockfile without drifting R15a deps, runs the
      # Node suite, then rebuilds dist/ from source before packaging.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Install, test and rebuild UI dist (Node 22, locked)
        working-directory: desktop/ui
        run: |
          node --version
          npm --version
          npm ci
          npm test
          npm run build

      - name: Verify UI dist routes and resources
        working-directory: desktop/ui
        shell: pwsh
        run: |
          if (-not (Test-Path dist/bundle.js)) { throw "missing dist/bundle.js" }
          if (-not (Test-Path dist/index.html)) { throw "missing dist/index.html" }
          if (-not (Test-Path dist/styles.css)) { throw "missing dist/styles.css" }
          $bundle = Get-Content dist/bundle.js -Raw
          foreach ($needle in @("shortlab", "hedge-monitor", "hedge-planner")) {
            if ($bundle -notmatch $needle) { throw "dist bundle missing route resource: $needle" }
          }

      - name: Sync backend dependencies (locked)
        working-directory: desktop/backend
        run: uv sync

      # PyInstaller must run inside the project environment (`uv run --with`),
      # NOT an isolated `uv tool run` env — Analysis needs to import
      # pandas/fastapi/uvicorn/duckdb/crypcodile from the synced venv to bundle
      # them. `--with pyinstaller` adds the packager ephemerally on top of the
      # locked dependency set. Same command as documented in short-lab.spec /
      # docs and desktop/backend/requirements-freeze.md.
      - name: Package backend (short-lab.spec)
        working-directory: desktop/backend
        run: uv run --with pyinstaller pyinstaller short-lab.spec --noconfirm

      # api/app.py resolves the UI via parents[4]/ui/dist. From the frozen
      # module (dist/short-lab/_internal/...) that points one level ABOVE the
      # app folder, i.e. <dist>/ui/dist. Mirror the UI bundle there so the
      # legacy resolution finds it too (the spec already placed a copy at
      # _internal/ui/dist for the sys._MEIPASS fallback). See the
      # short-lab.spec header for the full path math.
      - name: Mirror UI bundle for the legacy _UI_DIST path
        working-directory: desktop/backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ui | Out-Null
          Copy-Item -Recurse -Force ..\ui\dist dist\ui\dist

      # R16 product gate: this frozen smoke MUST pass before the zip and the
      # GitHub Release publish below. The three steps (verify -> zip ->
      # publish) intentionally carry no `if: always()` so a smoke failure
      # blocks both artefacts. The two upload steps at the end are the only
      # ones allowed `if: always()` (with `if-no-files-found: error` so a
      # missing P06 evidence tree fails the run instead of passing silent).
      - name: Verify real frozen product (two boots, schema 006, UI and writable data)
        working-directory: desktop/backend
        shell: pwsh
        run: uv run python ../../scripts/smoke_shortlab_packaged.py --executable dist/short-lab/short-lab.exe --fixture --output-dir runtime/verification/packaged-${{ github.run_id }}-${{ github.run_attempt }}

      # Gate: no `if: always()` here — a failed smoke above blocks this zip.
      - name: Zip the packaged tree
        working-directory: desktop/backend
        shell: pwsh
        run: |
          Compress-Archive -Path dist\short-lab, dist\ui -DestinationPath short-lab-windows-x64.zip -Force

      # Tag builds publish the zip to the GitHub Release for this tag.
      # Desktop-only, research build: not an automated trader; provider keys
      # stay in env, never in the bundle. The Android version does not move
      # with Desktop tags. Gate: no `if: always()` — a failed smoke above
      # blocks this publish.
      - name: Publish desktop zip to the GitHub Release (tag builds only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/short-lab-v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desktop/backend
        run: |
          {
            echo "# short-lab ${GITHUB_REF_NAME} (Desktop-only)"
            echo
            echo "Research build — not an automated trader, places no orders."
            echo "Unzip and run \`short-lab/short-lab.exe\` (serves 127.0.0.1:46408)."
            echo "Provider keys are read from the environment, never bundled."
            echo
            echo "Upgrading in the same Python environment: uninstall the old"
            echo "\`diveintocrypto-desktop\` distribution first, then install"
            echo "\`short-lab-desktop\`. Do not install both side by side."
          } > desktop-release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "short-lab ${GITHUB_REF_NAME}" \
            --notes-file desktop-release-notes.md \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" \
            --clobber \
            short-lab-windows-x64.zip

      - name: Upload desktop package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-lab-windows-x64
          path: desktop/backend/short-lab-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      # H11 delivery gate (design C3.4) + R16 P06 evidence gate: the same
      # verification tree the smoke and packaging tests write locally
      # (desktop/backend/runtime/verification/) is uploaded as its own
      # artifact — even when an earlier step failed — so every P06 row stays
      # downloadable. `if-no-files-found: error` makes a missing evidence
      # tree fail the run. Android job untouched.
      - name: Upload desktop verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-lab-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop/backend/runtime/verification/
          if-no-files-found: error
          retention-days: 30
