# short-lab manual asset-identity overrides (Task 5, design 4.2 priority 1).
#
# - This file is the ONLY human-verified mapping table. It is versioned
#   (`version` bumps on every manual change) and read-only at runtime:
#   `shortlab/identity/overrides.py` exposes no write API.
# - Each key is an exact Binance USDT-M futures symbol. No prefix stripping
#   or fuzzy matching is applied when looking entries up.
# - `contract_multiplier` here means: one futures contract quote unit equals
#   this many base coins (e.g. 1000PEPEUSDT == 1000 PEPE). `multiplier_source`
#   is always MANUAL for entries in this file.
# - Quote volumes and OI are USD-notional and must NEVER be scaled by this
#   multiplier; only prices go through canonical_price = futures_price /
#   multiplier.
version: 1
overrides:
  "1000PEPEUSDT":
    canonical_id: "pepe"
    display_symbol: "PEPE"
    name: "Pepe"
    binance_spot_symbol: "PEPEUSDT"
    contract_multiplier: 1000
    multiplier_source: "MANUAL"
    coingecko_id: "pepe"
    chain: "ethereum"
    contract_address: "0x6982508145454ce325ddbe47a25d4ec3d2311933"
    categories: ["meme"]
  "1000SHIBUSDT":
    canonical_id: "shiba-inu"
    display_symbol: "SHIB"
    name: "Shiba Inu"
    binance_spot_symbol: "SHIBUSDT"
    contract_multiplier: 1000
    multiplier_source: "MANUAL"
    coingecko_id: "shiba-inu"
    chain: "ethereum"
    contract_address: "0x95ad61b0a150d79219dcf64e1e6ccfad2e6e7f3af"
    categories: ["meme"]
